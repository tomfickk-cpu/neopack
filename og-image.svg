<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>

    <!-- Green Glow -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="100%" style="stop-color:#00cc33"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff41" stroke-width="0.3" opacity="0.08"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline overlay -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,255,65,0.03)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#greenGrad)" opacity="0.8"/>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#cyanGrad)" opacity="0.8"/>

  <!-- Left vertical accent -->
  <rect x="0" y="0" width="3" height="630" fill="url(#greenGrad)" opacity="0.4"/>

  <!-- Right vertical accent -->
  <rect x="1197" y="0" width="3" height="630" fill="url(#cyanGrad)" opacity="0.4"/>

  <!-- Terminal window decoration (top right) -->
  <g transform="translate(850, 40)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="rgba(0,20,0,0.6)" stroke="#00ff41" stroke-width="1" opacity="0.7"/>
    <rect x="0" y="0" width="300" height="30" rx="8" fill="rgba(0,255,65,0.08)"/>
    <rect x="0" y="15" width="300" height="15" fill="rgba(0,255,65,0.08)"/>
    <circle cx="20" cy="15" r="4" fill="#ff5f56"/>
    <circle cx="35" cy="15" r="4" fill="#ffbd2e"/>
    <circle cx="50" cy="15" r="4" fill="#27c93f"/>
    <text x="20" y="55" font-family="'Courier New', monospace" font-size="11" fill="#00ff41" opacity="0.9">root@neo:~$ ./setup --all</text>
    <text x="20" y="75" font-family="'Courier New', monospace" font-size="11" fill="#c0c0c0">⚙ Inicializando agentes...</text>
    <text x="20" y="95" font-family="'Courier New', monospace" font-size="11" fill="#00ff41">✓ 206 agentes carregados</text>
    <text x="20" y="115" font-family="'Courier New', monospace" font-size="11" fill="#00ff41">✓ 14 MCP servers ativos</text>
    <text x="20" y="135" font-family="'Courier New', monospace" font-size="11" fill="#00ff41">✓ 7 LSPs configurados</text>
    <text x="20" y="160" font-family="'Courier New', monospace" font-size="11" fill="#00f0ff" font-weight="bold">SISTEMA OPERACIONAL █</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(60, 0)">

    <!-- Logo -->
    <text x="0" y="100" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" fill="#00ff41" filter="url(#glowGreen)">NEOPACK</text>
    <text x="310" y="100" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" fill="#00f0ff" filter="url(#glowCyan)">iA</text>

    <!-- Divider line -->
    <line x1="0" y1="120" x2="550" y2="120" stroke="#00ff41" stroke-width="1" opacity="0.3"/>

    <!-- Main Headline -->
    <text x="0" y="180" font-family="'Arial Black', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#ffffff">CONFIGURE SEU</text>
    <text x="0" y="250" font-family="'Arial Black', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#00ff41" filter="url(#glowStrong)">EXÉRCITO DE</text>
    <text x="0" y="320" font-family="'Arial Black', 'Impact', sans-serif" font-size="64" font-weight="900" fill="#00f0ff" filter="url(#glowCyan)">AGENTES AI</text>

    <!-- Subtitle -->
    <text x="0" y="380" font-family="'Courier New', monospace" font-size="18" fill="#c0c0c0">206 agentes · 14 MCPs · 7 LSPs · 7 plataformas</text>
    <text x="0" y="410" font-family="'Courier New', monospace" font-size="16" fill="#888888">Setup em 1 clique · Economia de até 70% em créditos</text>

    <!-- Feature pills -->
    <g transform="translate(0, 450)">
      <rect x="0" y="0" width="100" height="28" rx="14" fill="rgba(0,255,65,0.12)" stroke="rgba(0,255,65,0.3)" stroke-width="1"/>
      <text x="50" y="19" font-family="'Courier New', monospace" font-size="11" fill="#00ff41" text-anchor="middle">Fullstack</text>

      <rect x="115" y="0" width="100" height="28" rx="14" fill="rgba(0,240,255,0.12)" stroke="rgba(0,240,255,0.3)" stroke-width="1"/>
      <text x="165" y="19" font-family="'Courier New', monospace" font-size="11" fill="#00f0ff" text-anchor="middle">Cloud & DevOps</text>

      <rect x="230" y="0" width="100" height="28" rx="14" fill="rgba(192,64,255,0.12)" stroke="rgba(192,64,255,0.3)" stroke-width="1"/>
      <text x="280" y="19" font-family="'Courier New', monospace" font-size="11" fill="#c040ff" text-anchor="middle">AI/ML & Dados</text>

      <rect x="345" y="0" width="100" height="28" rx="14" fill="rgba(255,215,0,0.12)" stroke="rgba(255,215,0,0.3)" stroke-width="1"/>
      <text x="395" y="19" font-family="'Courier New', monospace" font-size="11" fill="#FFD700" text-anchor="middle">GPU/CUDA</text>

      <rect x="460" y="0" width="100" height="28" rx="14" fill="rgba(255,70,70,0.12)" stroke="rgba(255,70,70,0.3)" stroke-width="1"/>
      <text x="510" y="19" font-family="'Courier New', monospace" font-size="11" fill="#ff4646" text-anchor="middle">Segurança</text>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="590" font-family="'Courier New', monospace" font-size="13" fill="rgba(255,255,255,0.2)" text-anchor="middle">neopack.app · Config AI Máxima · Licença Vitalícia</text>

  <!-- Scanline overlay -->
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.5"/>
</svg>
